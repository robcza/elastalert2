services:
    tox:
        build:
            context: ../
            dockerfile: tests/Dockerfile-test
        command: tox
        container_name: elastalert_tox
        working_dir: /home/elastalert
        volumes:
            - ../:/home/elastalert/
    clickhouse:
        image: clickhouse/clickhouse-server:23.4
        ports:
          - "9000:9000"
        healthcheck:
          test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
          interval: 5s
          retries: 5
